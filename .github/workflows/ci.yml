name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build (treat warnings as errors)
        run: dotnet build --no-restore -c Release /p:TreatWarningsAsErrors=true

      - name: Run tests with coverage
        run: >
          dotnet test --no-build -c Release
          --collect:"XPlat Code Coverage"
          --results-directory coverage
          --logger "trx;LogFileName=results.trx"

      - name: Generate coverage report
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          reportgenerator -reports:coverage/**/coverage.cobertura.xml -targetdir:coverage/html

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/html

      # ── Installer compile check ─────────────────────────────────────────────
      # ISCC otherwise only runs in the tag-triggered release workflow, so a
      # broken ClipHive.iss would surface at release time. Compile it on every
      # CI run with a throwaway version to catch script errors early (also
      # verifies the /DMyAppVersion define wins over the in-script fallback).
      - name: Publish installer payload
        run: >
          dotnet publish src/ClipHive/ClipHive.csproj
          -c Release -r win-x64 --self-contained false
          -o dist/release

      - name: Compile installer script
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DMyAppVersion=0.0.0 installer\ClipHive.iss
          if (-not (Test-Path "dist\ClipHive-0.0.0-Setup.exe")) {
            Write-Error "Installer was not produced with the CI-passed version — the /DMyAppVersion define is being ignored."
            exit 1
          }

      - name: Check coverage threshold (80%)
        run: |
          python -c "
          import xml.etree.ElementTree as ET, glob, sys
          f = glob.glob('coverage/**/coverage.cobertura.xml', recursive=True)[0]
          r = float(ET.parse(f).getroot().get('line-rate', '0'))
          print(f'Coverage: {r*100:.1f}%')
          sys.exit(0 if r >= 0.80 else 1)
          "
